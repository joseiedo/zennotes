name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Self-hosted only: the image is built (and, on main, pushed) by
# ghcr-publish.yml, so this job just checks the code.
jobs:
  build:
    name: Typecheck, test and build
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: apps/server/go.mod
          cache-dependency-path: apps/server/go.sum

      - name: Install dependencies
        run: npm ci

      - name: Typecheck, test and build
        env:
          GOCACHE: ${{ runner.temp }}/go-build-cache
        run: npm run build:prod

      # After the build: apps/server/web embeds the web bundles it produces.
      - name: Go vet
        working-directory: apps/server
        run: go vet ./...
